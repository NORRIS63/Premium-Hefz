name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and release APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: premium-hefz-release-apk
          path: app/build/outputs/apk/release/app-release.apk
      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2-build.${{ github.run_number }}
          name: Premium Hefz release build ${{ github.run_number }}
          prerelease: true
          files: app/build/outputs/apk/release/app-release.apk
